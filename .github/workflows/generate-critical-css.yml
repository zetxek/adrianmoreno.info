name: Generate Critical CSS
# Run on pull requests to main
on:
  pull_request:
    branches: [main]
jobs:
  generate-critical-css:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: true  # Fetch Hugo themes
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
  
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_VERSION }}
          extended: true

      - name: hugo npm pack
        run: hugo mod npm pack

      - run: npm install

      - name: Install Chromium for critical's render engine
        # critical's render engine imports `playwright` (its optional peer dep), which
        # is a different package from `@playwright/test` and carries a different
        # Chromium build. node_modules/.bin/playwright points at whichever of the two
        # npm linked last, so `npx playwright install` installed the @playwright/test
        # build and left critical failing with "Executable doesn't exist at
        # .../chromium_headless_shell-<rev>" once the two versions diverged
        # (Dependabot bumping `playwright` on its own). Call the CLI of the package
        # critical actually imports.
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Build
        run: hugo --minify --buildDrafts=true
      

      - name: Run critical script file
        run: |
          chmod +x ./critical-css.sh
          ./critical-css.sh
        shell: bash

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Update critical CSS'
          add: 'assets/css/critical.css'
          token: ${{ secrets.GITHUB_TOKEN }}