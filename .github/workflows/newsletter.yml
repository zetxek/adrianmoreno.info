name: Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      # The unit tests gate this workflow, so changes to them or to the
      # package.json test script must trigger a run too.
      - 'tests/unit/**'
      - 'package.json'
      - '.github/workflows/newsletter.yml'
  # Posts are often future-dated, so a push alone is not enough — the post may
  # not be published yet at push time, and nothing would re-trigger later.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the email without contacting Resend'
        type: boolean
        default: true

concurrency:
  # Never let two runs create broadcasts for the same post concurrently.
  group: newsletter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # `contents: write` credentials would otherwise sit in .git/config
          # through `npm ci` and the Hugo build. A malicious install script in
          # that window could read the token and push to main. The push step
          # supplies the credential itself, at the moment it is needed.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '${{ vars.HUGO_VERSION }}'
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # NEWSLETTER_FROM and SITE_BASE_URL are not secrets — a sender address and
      # a public URL — so a repository *variable* is their natural home. They are
      # read from `vars` with a `secrets` fallback, so either placement works and
      # neither silently yields an empty string.
      - name: Check configuration
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM || secrets.NEWSLETTER_FROM }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL }}
        run: |
          missing=()
          for name in RESEND_API_KEY RESEND_SEGMENT_ID NEWSLETTER_FROM SITE_BASE_URL; do
            # An `[ ... ] && arr+=(...)` one-liner would return non-zero on the
            # last iteration when the test is false, which `set -e` treats as a
            # step failure. Use a plain if.
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing configuration: ${missing[*]}"
            echo "Set them as repository secrets, or as variables for the two that are not secret." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required configuration is present."

      - name: Build site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL }}
        run: hugo --minify --baseURL "$SITE_BASE_URL"

      - name: Create draft broadcasts
        run: node scripts/newsletter/send.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM || secrets.NEWSLETTER_FROM }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL }}

      # Deliberately NOT `if: success()`. send.mjs exits non-zero when any post
      # fails, but posts that already succeeded have been written to the state
      # file. Skipping the commit on failure would discard those records, and
      # the next run would re-select those posts and create duplicate
      # broadcasts — the exact failure this system exists to prevent.
      - name: Commit state
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet .newsletter-state.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .newsletter-state.json
          git commit -m "chore: record newsletter sends [skip ci]"
          # main may have advanced while the site was building; without this the
          # push is rejected and the record of what was already sent is lost.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
