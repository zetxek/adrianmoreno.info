# Editorial course, not a second CV. Roles resolve to existing experience pages.
# Chapter ranges describe places; role tenures can overlap a transition.
edition: "01"
currentExperience: /experience/worksome
hero:
  eyebrow: "THE ENGINEERED RACE"
  tagline: "Technology, people, and the long game."
  body: "From building software on the Galician coast to leading engineering organizations across three countries. One continuous course; different ways of moving forward."
  origin: "Madrid, ES"
  coordinates: "40°24′N / 3°42′W"
  originNote: "Born in Madrid. Engineering roots in Galicia."
  start: "Explore the course"
chapters:
  - id: swim
    number: "01"
    discipline: SWIM
    terrain: granite
    place: Galicia
    location: "Santiago de Compostela, ES"
    period: "2007–2014"
    coordinates: "42°52′N / 8°32′W"
    title: "Learning to swim."
    lede: "Galicia shaped my engineering before I moved abroad. From writing code to owning its consequences, then to co-founding a company."
    lesson: "Ownership extends past the code I write."
    briefing: "CRAFT → OWNERSHIP"
    roles:
      - /experience/bahia
      - /experience/coremain
      - /experience/zadiasoftware
    transition:
      id: t1
      number: T1
      period: "2014 → 2015"
      route: "ES → NL"
      destination: Amsterdam
      coordinates: "52°22′N / 4°54′E"
      title: "From immersion to intention."
      body: "A new country. A new market. A chance to start afresh. I took the engineering discipline with me — and left room to reconsider the assumptions."
  - id: bike
    number: "02"
    discipline: BIKE
    terrain: slate
    place: Amsterdam
    location: "Amsterdam, NL"
    period: "2015–2021"
    coordinates: "52°22′N / 4°54′E"
    title: "The long work."
    lede: "From writing software to shaping the teams and decisions around it. The shift was not simply more responsibility; it was different work."
    lesson: "Management is a discipline alongside engineering, not a promotion out of it."
    briefing: "CRAFT → TEAM"
    roles:
      - /experience/themobilecompany
      - /experience/pocketmedia
      - /experience/emakinanl
      - /experience/vanmoof
