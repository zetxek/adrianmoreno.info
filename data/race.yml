      id: t2
      number: T2
      period: "2021"
      route: "NL → DK"
      destination: Copenhagen
      coordinates: "55°40′N / 12°34′E"
      title: "Change the measure."
      body: "From Amsterdam to Copenhagen. The course widened from leading engineering work to thinking about how an organization supports it. Different responsibilities ask different questions."
  - id: run
    number: "03"
    discipline: RUN
    terrain: chalk
    place: Copenhagen
    location: "Copenhagen, DK"
    period: "2021–"
    coordinates: "55°40′N / 12°34′E"
    title: "Ideas carried forward."
    lede: "Teams, technical direction, and the organizational decisions around them. A wider remit — and a renewed focus on helping people do their best work."
    lesson: "Direction should help teams make decisions without depending on one person."
    briefing: "TEAM → ORGANIZATION"
    roles:
      - /experience/sumup
      - /experience/worksome
principles:
  - title: "Ship the org chart you need, not the one you inherited."
    body: "Structure is a tool that follows strategy, not something to preserve for its own sake."
  - title: "Technical direction is a service to the team, not a trophy for the leader."
    body: "I want the team to be able to explain an architecture decision without me in the room."
  - title: "Trust compounds faster than velocity."
    body: "The trust that sustains delivery matters more than speed at the expense of the team."
