# Reused verbatim as the reduced-motion/mobile fallback text, the mobile dock
# label, and the persistent "Journey and Course passport" readout.
captions:
  start: "One craft. A journey beginning on Galicia’s water."
  swim: "Leaving Galicia, carrying the foundations forward."
  t1: "Across open water, towards Amsterdam’s canals."
  bike: "Through Amsterdam, with the same craft and a wider purpose."
  t2: "Leaving the canals for Copenhagen’s harbour."
  run: "Copenhagen comes alongside."
  finish: "Alongside in Copenhagen. Ready for the next conversation."
